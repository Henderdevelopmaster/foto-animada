name: Compilar APK

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Camaratrix-v1.0.${{ github.run_number }}.apk

      - name: Guardar APK de prueba
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: Camaratrix-dev-${{ github.run_number }}
          path: Camaratrix-v1.0.${{ github.run_number }}.apk
          if-no-files-found: error
          compression-level: 0

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Camaratrix v1.0.${{ github.run_number }}
          body: |
            Compilación automática de `${{ github.sha }}`.
            Descarga el APK de abajo e instálalo en el celular.
          files: Camaratrix-v1.0.${{ github.run_number }}.apk
          make_latest: true
